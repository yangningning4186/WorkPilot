[project]
name = "workpilot-backend"
version = "0.1.0"
description = "WorkPilot FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "bcrypt>=4.2,<5",
  "croniter>=6.0,<7",
  # 本机 SecretStore 使用 Fernet 加密 Provider API key 与 OAuth token；
  # 主密钥单独保存在仅当前用户可读的 0600 文件中。
  "cryptography>=45,<51",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "langgraph>=1.2.9,<1.3",
  # MCP v1 的异步 ClientSession 与 stdio / Streamable HTTP transport。
  "mcp>=1.28.1,<2",
  "openpyxl>=3.1,<4",
  "pgvector>=0.4,<1",
  "playwright==1.55.0",
  "pydantic-settings>=2.10,<3",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
  # config/routing.yaml 的解析。此前只是 langgraph 的传递依赖, 直接 import 就要显式声明。
  "python-multipart>=0.0.20,<1",
  "python-pptx>=1.0,<2",
  "pyyaml>=6.0.3,<7",
  # arq 全系列都把 redis 卡在 <6, 因此从 6.x 回退到 5.x。
  # 用到的只有 from_url / publish / pubsub / aclose, 5.0.1+ 全部具备。
  "redis>=5.0.1,<6",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25.4,<26",
  "uuid6>=2025.0.1,<2026",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-croniter>=6.0,<7",
  "types-pyyaml>=6.0.12,<7",
  "types-jsonschema>=4.25,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".."]
markers = [
  "integration: requires the PostgreSQL test database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# 中文注释、prompt、gold answer 与报告正文会有意使用全角标点；长字符串不强拆。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# 显式固定一方代码边界，避免从仓库根目录与 backend/ 运行时 import 分组漂移。
known-first-party = ["app", "eval", "tests"]

[tool.ruff.lint.per-file-ignores]
# eval 是离线 CLI；少量 Path.read_text/write_text 不阻塞在线请求或 worker 事件循环。
"**/eval/*.py" = ["ASYNC240"]
"../eval/*.py" = ["ASYNC240"]
"../eval/**/*.py" = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uuid6"]
ignore_missing_imports = true
