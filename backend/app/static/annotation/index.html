<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>WorkPilot · Gold Span Lab</title>
    <link rel="stylesheet" href="/annotation/assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">WP</span>
        <div>
          <strong>Gold Span Lab</strong>
          <span>证据先于答案</span>
        </div>
      </div>
      <div class="progress-cluster">
        <div class="dataset-picker">
          <label for="datasetSelect">数据集</label>
          <select id="datasetSelect" aria-label="选择评测数据集"></select>
        </div>
        <div class="progress-copy">
          <strong id="progressCount">0 / 20</strong>
          <span>首批人工标注</span>
        </div>
        <div class="progress-track" aria-hidden="true"><i id="progressBar"></i></div>
      </div>
      <button class="quiet-button" id="newItemButton" type="button">＋ 新样本</button>
    </header>

    <main class="workspace">
      <aside class="source-rail panel">
        <div class="panel-heading">
          <div><span class="eyebrow">01 / SOURCE</span><h1>资料与样本</h1></div>
          <button class="icon-button" id="refreshButton" title="刷新" aria-label="刷新">↻</button>
        </div>
        <div class="search-box">
          <span>⌕</span><input id="documentSearch" placeholder="搜索文档标题或路径" />
        </div>
        <div class="rail-tabs" role="tablist">
          <button class="active" data-tab="documents" type="button">资料 <span id="docCount">0</span></button>
          <button data-tab="items" type="button">样本 <span id="itemCount">0</span></button>
        </div>
        <div id="documentList" class="rail-list"></div>
        <div id="itemList" class="rail-list hidden"></div>
      </aside>

      <section class="evidence-column panel">
        <div class="panel-heading evidence-heading">
          <div>
            <span class="eyebrow">02 / EVIDENCE</span>
            <h2 id="documentTitle">选择一份资料</h2>
            <p id="documentMeta">从左侧开始，证据选区会被转换为稳定的 code-point offset。</p>
          </div>
          <button class="quiet-button compact hidden" id="openSourceButton" type="button">打开原文件 ↗</button>
        </div>
        <div class="evidence-tools">
          <div class="search-box flex-search"><span>⌕</span><input id="blockSearch" placeholder="在当前文档中查找证据" /></div>
          <select id="blockType" aria-label="筛选 block 类型">
            <option value="">全部类型</option><option value="title">标题</option>
            <option value="paragraph">段落</option><option value="table">表格</option>
            <option value="formula">公式</option><option value="figure_caption">图注</option>
            <option value="code">代码</option><option value="list">列表</option>
          </select>
        </div>
        <div class="evidence-hint"><span>操作</span>拖选原文后点击“加入选区”，或直接把整块作为证据。</div>
        <div id="blockList" class="block-list empty-state">
          <div class="empty-illustration">⌁</div><strong>还没有打开文档</strong><p>选择左侧资料，开始锚定可复现的原文证据。</p>
        </div>
        <button id="loadMoreButton" class="load-more hidden" type="button">加载更多 block</button>
      </section>

      <aside class="annotation-column panel">
        <div class="panel-heading">
          <div><span class="eyebrow">03 / LABEL</span><h2>问题与金标</h2></div>
          <span id="saveState" class="save-state idle">未保存</span>
        </div>

        <form id="annotationForm" novalidate>
          <input id="itemId" type="hidden" />
          <fieldset class="category-grid">
            <legend>问题类型</legend>
            <label><input type="radio" name="category" value="single_hop" checked /><span>单跳</span></label>
            <label><input type="radio" name="category" value="multi_hop" /><span>多跳</span></label>
            <label><input type="radio" name="category" value="table" /><span>表格</span></label>
            <label><input type="radio" name="category" value="unanswerable" /><span>不可答</span></label>
          </fieldset>

          <label class="field-label" for="question">问题 <em>必填</em></label>
          <textarea id="question" rows="3" placeholder="写成真实会向资料库提出的问题…" required></textarea>

          <div class="section-label">
            <label class="field-label">Gold spans <em id="spanRequirement">至少 1 条</em></label>
            <span id="spanCount">0 条证据</span>
          </div>
          <div id="spanList" class="span-list"><p class="inline-empty">从中栏原文添加证据。</p></div>

          <label class="field-label" for="goldAnswer">Gold answer <em id="answerRequirement">必填</em></label>
          <textarea id="goldAnswer" rows="5" placeholder="只写被所选证据完整支撑的答案…"></textarea>

          <details class="advanced-fields">
            <summary>约束与难度 <span>可选</span></summary>
            <label class="field-label" for="mustInclude">必须包含</label>
            <input id="mustInclude" placeholder="用逗号分隔，例如 queue, batch" />
            <label class="field-label" for="mustNotInclude">不得包含</label>
            <input id="mustNotInclude" placeholder="常见幻觉词，用逗号分隔" />
            <div class="two-fields">
              <label>难度<select id="difficulty"><option value="1">1 · 直接</option><option value="2">2 · 组合</option><option value="3">3 · 困难</option></select></label>
              <label>来源<select id="origin"><option value="human">人工</option><option value="badcase">Badcase</option><option value="synthetic">合成候选</option></select></label>
            </div>
          </details>

          <div id="formError" class="form-error hidden" role="alert"></div>
          <div class="form-actions">
            <button id="deleteButton" class="danger-button hidden" type="button">删除</button>
            <button class="primary-button" type="submit">保存金标 <span>⌘ ↵</span></button>
          </div>
        </form>

        <section class="page-preview" id="pagePreview">
          <div class="preview-heading"><strong>页面定位</strong><span id="previewLabel">选择带页码的 block</span></div>
          <div id="pageStage" class="page-stage"><div class="preview-empty">PDF bbox 会显示在这里</div></div>
        </section>
      </aside>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/annotation/assets/app.js" defer></script>
  </body>
</html>
