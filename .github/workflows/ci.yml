# 静态门禁：Ruff / mypy / pytest / ESLint / tsc。
# 范围按 docs/09-排期与任务清单.md「CI 门禁 · 静态检查范围已冻结」，不在此扩张。
#
# 这一层刻意**不含任何评测跑批**：evaluation 门禁（smoke + regression 规则轨）
# 需要随仓库版本化的公开 fixture 语料与预计算 embedding，未就绪前不挂进来，
# 免得门禁一开始就是红的、然后所有人习惯性忽略（docs/06 §4.5）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一分支的旧跑批直接取消，PR 连推几次不排队。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 没有 service 容器。PostgreSQL 与 Redis 已退役（docs/adr/0012），测试状态全在
    # tmp_path 下的 SQLite / JSONL 里，`docker compose down` 之后 644 个用例照常跑。

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked：lock 与 pyproject 不一致直接失败，不允许 CI 悄悄解出另一套依赖。
      # Python 版本由 backend/.python-version 固定为 3.12（3.14 上 ML 依赖无 wheel）。
      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check app tests ../eval packages --config pyproject.toml

      - name: mypy
        run: uv run mypy app packages/workpilot-ai/src/workpilot_ai packages/workpilot-telemetry/src/workpilot_telemetry

      # 层次契约（docs/adr/0011）。放在 mypy 之后、pytest 之前：它比 pytest 快两个量级,
      # 层次违规没必要等跑完 644 个用例才被告知。
      - name: import-linter
        run: uv run lint-imports

      # conftest 用 tmp_path_factory 建每个测试自己的本地 store，没有迁移步骤。
      - name: pytest
        run: uv run pytest

  frontend:
    name: frontend (eslint + tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 本机开发在 25.x（Current）；CI 钉 LTS。两者行为分叉时以本文件为准。
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck
