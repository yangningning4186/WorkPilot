# 静态门禁：Ruff / mypy / pytest / ESLint / tsc。
# 范围按 docs/09-排期与任务清单.md「CI 门禁 · 静态检查范围已冻结」，不在此扩张。
#
# 这一层刻意**不含任何评测跑批**：evaluation 门禁（smoke + regression 规则轨）
# 需要随仓库版本化的公开 fixture 语料与预计算 embedding，未就绪前不挂进来，
# 免得门禁一开始就是红的、然后所有人习惯性忽略（docs/06 §4.3）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一分支的旧跑批直接取消，PR 连推几次不排队。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # 版本与 deploy/docker-compose.yml 对齐；migrations 里自己 CREATE EXTENSION vector，
      # 所以只要基础镜像带 pgvector 即可。
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          # conftest 拒绝名称不以 _test 结尾的库，这里直接把它建成默认库，
          # 省掉 deploy/postgres/init 那份 initdb 脚本（service container 不挂载仓库文件）。
          POSTGRES_DB: workpilot_test
          POSTGRES_USER: workpilot
          POSTGRES_PASSWORD: workpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workpilot -d workpilot_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      # 不是可选的：test_rate_limit 的原子 token bucket 和 /ready 健康检查都打真 Redis，
      # 缺了这两条必挂（其余 redis 相关用例用的是注入的假客户端）。
      redis:
        image: redis:8.2.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://workpilot:workpilot@localhost:5432/workpilot_test
      REDIS_URL: redis://localhost:6379/0

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked：lock 与 pyproject 不一致直接失败，不允许 CI 悄悄解出另一套依赖。
      # Python 版本由 backend/.python-version 固定为 3.12（3.14 上 ML 依赖无 wheel）。
      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check app tests migrations ../eval --config pyproject.toml

      - name: mypy
        run: uv run mypy app

      # conftest 会先跑 alembic upgrade head，再对 workpilot_test 建表。
      - name: pytest
        run: uv run pytest

  frontend:
    name: frontend (eslint + tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 本机开发在 25.x（Current）；CI 钉 LTS。两者行为分叉时以本文件为准。
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck
